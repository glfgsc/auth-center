server:
  port: 8090

spring:
  application:
    name: auth-center
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_center}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# RSA key pair — 首次启动自动生成并持久化到 data/ 目录
auth:
  jwt:
    rsa-key-dir: ${AUTH_RSA_KEY_DIR:./data/keys}
    access-token-expiration: 86400000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins: ${AUTH_CORS_ORIGINS:*}
  cas:
    # CAS Service Ticket 有效期（毫秒）
    ticket-ttl: 30000
    # TGT 有效期（毫秒）— 默认 8 小时
    tgt-ttl: 28800000

logging:
  level:
    com.auth.center: DEBUG
